# Every two days: feed the board's completed matches back into the
# results bank, re-measure the live-safety bands on the board's own
# record, re-render, and commit to main so the site deploys.
#
# The bettor's ask, 12 Sep. The commands the operator used to run by
# hand, in the order they depend on each other:
#   scripts/ingest_board.py   completed board cards -> the store (idempotent)
#   scripts/matchbank.py      the store replayed into CARDS -> the bank.
#                             --since, because a full rebuild is 52 minutes
#                             against this job's 30-minute cap: the cards
#                             already banked are kept, everything inside a
#                             month of the bank's edge is priced afresh, and
#                             the guard relabels all 32,000 either way. About
#                             two minutes. WITHOUT THIS STEP the loop was a
#                             circle: ingest_board fed the STORE, and every
#                             measurement below reads the BANK, which nothing
#                             rebuilt — so the bank sat at 30 Aug while the
#                             board ran on to mid-September, and livebands
#                             re-measured the same frozen answer every two
#                             days (the bettor caught it, 15 Sep)
#   scripts/livebands.py      the live tag's bands, measured on the bank
#                             per league (50 cards or more) and for the
#                             whole bank, red cards out, labelled by hit
#                             rate (safe >= 79, cautious >= 77, else
#                             unsafe); the flip study on the board's
#                             last three weeks; the STRIKE COMBOS on the
#                             board's settled cards (a lane and its
#                             strikes landing under 77 on 15+ cards is
#                             declined, and released again at 77)
#   scripts/drift.py          the FROZEN rules measured against the bank —
#                             label rates, the tier's side-blindness, the
#                             colour ladder's order, each band bar's ROI,
#                             the strong bar. Report only: it changes
#                             nothing, it says when a constant has gone
#                             stale (both the Over clause and the strong
#                             bar sat wrong for weeks before a person read
#                             them)
#   scripts/board.py          render README + app + live.json, then verify
#
# THE ENGINE'S RULES ARE NOT TOUCHED. config/guard_slices.tsv and
# config/league_hitrates.tsv are engine inputs and nothing here writes
# them; no label rate, tier cut, band bar or strong bar moves, which is
# what drift.py exists to keep honest. The bank IS re-priced, and always
# was — matchbank replays fixtures through the CURRENT engine, so a card
# banked today is priced by today's build. That is the bank's whole
# meaning and the reason it is rebuilt rather than appended to.
#
# What can change on a run is which unstaked cards are OFFERED for a
# live buy and where they file — and, since 12 Sep, which cards are IN
# THE RECORD: an unstaked card whose band is unsafe is declined and out
# of every displayed hit rate, board and bank, so a band flipping here
# moves the session bar, the baselines and the retrosim table.
#
# The commit subject carries no "[skip render]" on purpose: this is one
# that should deploy. If the live sweep pushes first the push is refused;
# the job resets onto main and runs the commands again — all of them are
# reproducible from the files, so a retry writes the same thing onto the
# newer board.
name: bank refresh

on:
  schedule:
    - cron: "0 6 */2 * *"      # 06:00 UTC every other day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: |
          git config user.name  "tempo-guard bot"
          git config user.email "noreply@anthropic.com"
          for try in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cd backend
            python scripts/ingest_board.py
            # National-team results come from ESPN directly rather than from
            # the board, because a confederation code is fed by several slugs
            # and nothing else fetches them. --since 2026 re-asks only the
            # current year, which is a handful of requests, not the 15-season
            # history.
            python scripts/internationals.py --write --since 2026 || echo "international refresh failed, continuing"
            python scripts/matchbank.py --since
            python scripts/livebands.py
            # The verdict per declining rule — tier red, live unsafe on each
            # lane (priced included since 21 Sep), strike combo — on the
            # board's own settled cards first, the bank beside it. Report
            # only; livebands above is what moves the bands.
            python scripts/declinecheck.py
            python scripts/drift.py
            # --allow-stale: a Polish or Algerian card waiting for a hand-set
            # score is a sweep matter, not a bank matter. Without the flag
            # board.verify refused the render and this job died on it on
            # 15, 17 and 19 Sep — three refreshes that never committed the
            # bands and the bank they had just measured.
            python scripts/board.py --allow-stale
            cd ..
            git add -A data/ config/live_bands.tsv config/drift.tsv \
                       config/declinecheck.tsv \
                       config/ladder_rates.tsv \
                       config/matchbank_retro.json \
                       config/forward_log.tsv \
                       config/reads_cache.json README.md web/
            if git diff --cached --quiet; then
              echo "nothing changed"; exit 0
            fi
            git commit -q -m "bank refresh: $(date -u '+%Y-%m-%d %H:%M') UTC" \
              -m "board results merged into the bank; live-safety bands re-measured on the last three weeks; board re-rendered"
            if git push origin HEAD:main; then
              echo "pushed on try $try"; exit 0
            fi
            echo "push refused on try $try — resetting onto main and running again"
          done
          echo "could not push after 3 tries"; exit 1
