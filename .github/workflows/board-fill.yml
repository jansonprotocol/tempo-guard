# Once a day: put next week's fixtures on the board from the odds feed.
#
# WHY THIS EXISTS (the bettor, 21 Sep, watching the Playable tab fill
# after an odds refresh: "is it now automatically whenever odds refresh
# pulls matches from its refresh it also grades it automatically?"). It
# was not. Every card on the board had arrived through a slate somebody
# typed from screenshots — the one step of the loop still done by hand,
# while pricing (odds-refresh) and grading (live-sweep) ran themselves.
# The feed's answer to one league call is a fixture list, so the listing
# the refresh already pays for is the slate. "make this."
#
# scripts/feedslate.py lists every league the engine has a store for and
# the feed has a live key for, keeps the fixtures kicking off in the next
# seven days that the board does not already carry (same league, same
# two clubs, within a day), refuses any name the engine cannot resolve
# against its own store (printed, never guessed), and hands the rest to
# futurematch — the same path a typed slate takes: priced through the
# current engine, quoted from the feed, rendered and verified. The
# leagues the feed lacks (Algeria, Colombia, Morocco, Peru, the Dutch
# second division, the friendlies, CAF and AFC) still come in by hand.
#
# COST. About forty leagues at two credits each when the 90-minute cache
# is cold, once a day — under a hundred credits, a tenth of what the
# two-hourly price refresh spends.
#
# A refused push is recovered by resetting onto main and filling again:
# the fill is a pure function of the feed and the board, and the dedupe
# means a second pass adds nothing a first pass already landed.
name: board fill (from the feed)

on:
  schedule:
    - cron: "15 5 * * *"       # 05:15 UTC daily, before the 06:00 two-day refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - name: the key must exist, or say so out loud
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "::error::ODDS_API_KEY is not set as a repository secret — the feed cannot be listed."
            exit 1
          fi
      - env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          git config user.name  "tempo-guard bot"
          git config user.email "noreply@anthropic.com"
          git fetch origin main
          git reset --hard origin/main
          cd backend
          # --allow-stale: an unswept no-feed card hours past kickoff is
          # the sweep's problem, not a reason to leave the week unfilled
          python scripts/feedslate.py --write --allow-stale
          # and say so if any pending card's kickoff has drifted from
          # the feed's, on the Amsterdam clock — a moved match or a typo
          python scripts/feedslate.py --clock || true
          cd ..
          git add -A config/fixtures.tsv config/odds_quotes.tsv config/last_quotes.tsv \
                     config/reads_cache.json config/roi_log.tsv \
                     config/forward_log.tsv config/play_lock.tsv config/tier_band_log.tsv README.md web/
          if git diff --cached --quiet; then
            echo "nothing to add — the board already has the week"; exit 0
          fi
          n=$(git diff --cached --numstat config/fixtures.tsv | cut -f1)
          git commit -q -m "board fill: $(date -u '+%Y-%m-%d') — ${n:-0} cards from the feed" \
            -m "Next week's fixtures in every league the engine and the feed both carry, priced through the current engine and quoted, as a typed slate would be."
          # THE PUSH, NOT THE FILL, IS WHAT LOSES THE RACE (11 Oct). The
          # live sweep pushes every two minutes; a fill takes minutes. The
          # old loop answered a refused push by throwing the whole fill
          # away and starting over, which simply lost the same race again
          # — the board fill failed every day from 6 to 11 Oct and the
          # board ran a week short. So the fill happens ONCE, and a
          # refused push is answered by merging what the sweep pushed and
          # re-rendering on top of it. -X ours keeps the new cards where a
          # hunk truly collides; the sweep's own lines merge in cleanly,
          # since it edits rows the fill never touched.
          for try in $(seq 1 8); do
            if git push origin HEAD:main; then
              echo "pushed on try $try"; exit 0
            fi
            echo "push refused on try $try — merging what the sweep pushed"
            git fetch origin main
            git merge -X ours --no-edit origin/main || {
              for f in $(git diff --name-only --diff-filter=U); do
                git checkout --ours -- "$f" || git checkout MERGE_HEAD -- "$f"
                git add "$f"
              done
              git commit -q --no-edit
            }
            (cd backend && python scripts/board.py --allow-stale) || true
            git add -A config README.md web/
            git diff --cached --quiet || git commit -q -m "re-render onto the sweep's push"
            sleep $((RANDOM % 20 + 5))
          done
          echo "could not push after 8 tries"; exit 1
