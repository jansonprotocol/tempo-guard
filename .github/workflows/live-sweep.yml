# Keep the live board current without anyone asking for it.
#
# GitHub can only schedule a FIXED cron, but football is not on a fixed
# cron, so the shape here is: wake, decide cheaply, wait if the whistle is
# near, sweep in a loop while anything is live, hand over to a fresh run.
# Every run starts with scripts/livecheck.py, which imports nothing but
# the standard library and answers in about 40ms — is a fixture live and
# ungraded, or about to kick off, or how long until the next one?
#
# THE CADENCE DOES NOT COME FROM THE CRON, and that is deliberate. A */5
# schedule is a floor GitHub does not honour: on 7 Sep it fired at 02:21,
# 07:24 and 13:35, five to six hours apart, and the 13:35 run found
# nothing live, went home, and a 17:30 kickoff went unswept for an hour.
# So a run that arrives early no longer goes home — if the next kickoff
# is within WAIT_MAX it SLEEPS on the runner until LEAD minutes before
# the whistle (the repository is public, so runner minutes are free),
# then sweeps every SWEEP_EVERY seconds for as long as the gate says
# football is happening. When the loop ends it DISPATCHES the next run
# itself, so the chain continues on the board's own clock; the cron is
# only there to restart the chain if a run ever dies.
#
# The concurrency group means a cron that fires while a run is sleeping
# or sweeping queues behind it rather than starting a second one.
name: live sweep

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:          # a manual "sweep now" button, and the chain

concurrency:
  # Never let two sweeps write the board at once; queue the newer one
  # rather than cancelling, so a run that already fetched still commits.
  group: live-sweep
  cancel-in-progress: false

permissions:
  contents: write
  actions: write              # to dispatch the follow-up run

jobs:
  sweep:
    runs-on: ubuntu-latest
    # The job's whole life, waiting included; GitHub kills a job at 6h.
    timeout-minutes: 355
    env:
      LEAD_BUDGET_MIN: 340      # minutes the job plans around
      # Sleep at most this long for a kickoff: 4h40, which leaves an hour
      # of sweeping inside the budget. Beyond it the run goes home and the
      # cron (or the previous run's hand-over) asks again later.
      WAIT_MAX: 16800
      # How long a run parks when the board has no pending fixture at
      # all. Shorter than WAIT_MAX because that state is itself a fault
      # — the fill has not run — and the sooner a successor looks again
      # the sooner the board recovers on its own.
      EMPTY_PARK: 3600          # 1h
      SWEEP_EVERY: 90           # seconds between passes (the bettor, 8 Sep: "a bit more faster")
      # Seconds between DEPLOY-tagged commits. A build takes longer than
      # a sweep pass, and a new deploy cancels the one in flight, so this
      # has to be comfortably longer than a build (14 Oct).
      DEPLOY_EVERY: 180         # 3 min — the site branch builds in seconds
      # Every pass commits web/live.json, which the page polls from the
      # repository; the host is told to skip commits that only moved a
      # goal or a minute, so the deploy budget goes to kickoffs, finals
      # and merges. Render reads "[skip render]" in the commit message;
      # netlify.toml matches the same subjects by their prefix.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The gate. Either sweep now, or learn how long until the whistle
      # and sleep for it if that fits the job's budget. No dependencies
      # are installed above this line on purpose.
      - id: gate
        run: |
          START=$(date +%s)
          echo "start=$START" >> "$GITHUB_OUTPUT"
          cd backend
          WAIT=$(python scripts/livecheck.py --wait)
          python scripts/livecheck.py || true
          # A RUN NEVER GOES HOME — IT PARKS (28 Oct). Going home handed
          # the chain back to the cron, and the cron does not come: over
          # 21-28 Oct it left gaps of 4.4h, 4.9h, 6.0h and 6.7h between
          # sweeps, every one of them starting at a run that found the
          # next kickoff too far off and exited. The file already says a
          # */5 schedule "is a floor GitHub does not honour" — so nothing
          # may depend on it. The run sleeps instead and hands over on
          # the way out, which keeps the chain alive on its own clock.
          # Runner minutes are free on a public repository; a board that
          # stops updating for six hours is not.
          if [ "$WAIT" -lt 0 ]; then
            echo "::warning::no pending fixture on the board at all — the fill has not run; parking $((EMPTY_PARK/60)) min and handing over"
            sleep "$EMPTY_PARK"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$WAIT" -gt "$WAIT_MAX" ]; then
            echo "next kickoff is $((WAIT/60)) min away — parking $((WAIT_MAX/60)) min, then handing over"
            sleep "$WAIT_MAX"
            echo "go=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$WAIT" -gt 0 ]; then
            echo "next kickoff in $((WAIT/60)) min — sleeping until LEAD before it"
            sleep "$WAIT"
          fi
          echo "go=yes" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.go == 'yes'
        run: pip install -r backend/requirements.txt

      # Sweep, commit, wait, ask again — on this job's own clock rather
      # than GitHub's. Commits only when a score actually moved: sweep.py
      # rewrites the board every pass, so without that check the history
      # would take a commit every five minutes saying nothing.
      - if: steps.gate.outputs.go == 'yes'
        run: |
          git config user.name  "tempo-guard bot"
          git config user.email "noreply@anthropic.com"
          DEADLINE=$(( ${{ steps.gate.outputs.start }} + LEAD_BUDGET_MIN*60 ))
          cd backend
          pass=0
          fails=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            pass=$((pass+1))
            echo "::group::pass $pass"
            # A failed pass is LOUD and COUNTED. On 20 Sep every pass died
            # on an import error for 45 minutes while this line said
            # "continuing" and the run stayed green: the board froze with
            # a live match on it and nothing looked wrong. The pass still
            # continues — ESPN drops the odd request — but the failure is
            # annotated with its cause, and a run whose passes ALL failed
            # exits red at the end.
            if ! python scripts/sweep.py 2>&1 | tee /tmp/sweep.out; then
              fails=$((fails+1))
              echo "::warning::sweep pass $pass failed — $(grep -E 'Error|Traceback' /tmp/sweep.out | tail -1)"
            fi
            cd ..
            # THE 16 MB FILES NEVER TOUCH main (17 Oct). index.html and
            # matchbank.json are served by Render from the `site` branch,
            # so they are published there on a deploy pass, not committed
            # here. main keeps the data and web/live.json ONLY —
            # web/live.json because the page polls it from main's raw URL
            # between deploys. This is what finally stops main's 1.8 GB
            # history from growing at all.
            git add -A config/fixtures.tsv README.md web/live.json \
                       config/forward_log.tsv config/reads_cache.json \
                       config/live_log.tsv config/band_log.tsv config/tier_band_log.tsv config/play_lock.tsv config/roi_log.tsv || true
            # Every pass commits — but not every commit is a deploy. The
            # page polls web/live.json from the repository between
            # deploys, so a goal or a minute goes out as a small "live
            # tick" commit that the host is told to skip — Render reads
            # the "[skip render]" tag in the subject, Netlify matches the
            # "live tick:" / "live sweep:" prefix — and only a kickoff, a
            # final or a new row — the things that change which tab a
            # card sits in — carries the [deploy] marker that builds the
            # site. scripts/sweepdiff.py says what moved.
            RC=0; WHY=$(python backend/scripts/sweepdiff.py) || RC=$?
            # DEPLOYS ARE RARE ON PURPOSE (14 Oct, from the Render
            # dashboard: a build running 57m42s, then cancelled by the
            # next one, over and over — "deployments keep failing"). A
            # static deploy clones this repository, and the repository is
            # 1.8 GB because the sweep has committed a 16 MB index.html
            # 2,359 times in seven days. A build therefore takes tens of
            # minutes, while a deploy-tagged commit every few minutes
            # CANCELS the build in flight, so none of them can ever
            # finish and the site froze on an 19:09 build all evening.
            # (The carry-a-deploy rule written here an hour earlier made
            # that worse, not better, and is gone.)
            #
            # So at most one deploy every DEPLOY_EVERY seconds, whatever
            # moved. Scores and minutes still reach the page within a
            # sweep pass through web/live.json, which is what it is for;
            # only a card CHANGING TAB needs the rebuild, and that can
            # wait twenty minutes.
            LAST=$(git log -1 --format=%ct --grep='\[deploy\]' || true)
            AGE=$(( $(date +%s) - ${LAST:-0} ))
            [ "$AGE" -ge "$DEPLOY_EVERY" ] && DUE=1 || DUE=0
            echo "last deploy $((AGE/60)) min ago; due=$DUE"
            if git diff --cached --quiet && [ "$DUE" -eq 0 ]; then
              echo "nothing moved"
            else
              # DUE ALONE DECIDES THE DEPLOY (15 Oct: "live sweep is
              # stuck again"). The old gate also required a structural
              # change IN THIS PASS — but changes cluster: eight 21:00
              # kickoffs all landed in one pass at 19:03, while DUE was
              # still 0 (27 min since the last deploy), so they committed
              # as skip ticks; by 19:06 when DUE flipped to 1, that pass
              # saw "nothing moved" and never deployed, stranding the
              # whole night's kickoffs and the 18:45 finals on main. The
              # render changes every pass anyway (clock, live minutes),
              # so a DUE pass always has something to deploy — gate on
              # the clock only, and the accumulated structural changes
              # ride along in index.html.
              if [ "$DUE" -eq 1 ]; then
                SUBJECT="live sweep [deploy]: $(date -u '+%Y-%m-%d %H:%M') UTC"
                [ "$RC" -eq 0 ] || WHY="minutes only — web/live.json carries it to the page"
              elif [ "$RC" -eq 0 ]; then
                SUBJECT="live sweep: $(date -u '+%Y-%m-%d %H:%M') UTC [skip render]"
              else
                SUBJECT="live tick: $(date -u '+%Y-%m-%d %H:%M') UTC [skip render]"
                WHY="minutes only — web/live.json carries it to the page"
              fi
              echo "$SUBJECT — $WHY"
              # An empty commit is fine on a DUE pass with no data change:
              # it carries the [deploy] marker that stamps the deploy
              # clock (LAST, above) so the next DUE is measured from now.
              git commit -q --allow-empty -m "$SUBJECT" -m "$WHY"
              # Someone may have pushed while this ran. A sweep is
              # reproducible from the feed, so the right move on a refused
              # push is to DROP this pass, reset onto what was pushed, and
              # sweep again on top of it.
              if ! git push origin HEAD:${{ github.ref_name }}; then
                echo "push refused — resetting onto upstream and sweeping again"
                git fetch origin ${{ github.ref_name }}
                git reset --hard origin/${{ github.ref_name }}
                cd backend
                echo "::endgroup::"
                continue
              fi
            fi
            # THE DEPLOY ITSELF: publish web/ to the lightweight `site`
            # branch, which Render serves. A parentless commit of ~30 MB,
            # so the build takes seconds whatever main weighs. Only on a
            # DUE pass, and never fatal — a failed publish just waits for
            # the next one.
            if [ "$DUE" -eq 1 ]; then
              bash .github/publish-site.sh \
                "site: $(date -u '+%Y-%m-%d %H:%M') UTC (live sweep)" || \
                echo "::warning::site publish failed; next deploy retries"
            fi
            cd backend
            echo "::endgroup::"
            # Ask the gate again. When the last match settles the loop
            # ends here rather than burning the rest of its budget.
            if ! python scripts/livecheck.py; then
              echo "nothing live any more — loop done after $pass passes"
              break
            fi
            sleep "$SWEEP_EVERY"
          done
          echo "loop over after $pass passes ($fails failed)"
          if [ "$fails" -gt 0 ] && [ "$fails" -eq "$pass" ]; then
            echo "::error::every one of $pass sweep passes failed — the board was not updated by this run"
            exit 1
          fi

      # Hand over. Whatever happened above, if the board still has a
      # fixture coming, start the next run now: it will sleep for the
      # whistle or pick up where this one left off. Without this the
      # chain depends on a cron that fires when it likes.
      # (!cancelled(), not always(): a run someone stops by hand must not
      # resurrect itself — the cron brings the chain back later.)
      - if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd backend
          WAIT=$(python scripts/livecheck.py --wait)
          # ALWAYS. The two early exits that used to live here — "nothing
          # on the board" and "leaving it to the cron" — are the only
          # ways the chain could end, and between them they account for
          # every multi-hour hole in the sweep history. The gate above
          # has already slept for whichever case applies, so dispatching
          # now simply continues the chain; it cannot spin, because the
          # successor's own gate parks before it does anything. The cron
          # stays as the resurrector for a run that dies outright, which
          # is all it was ever reliable enough to be.
          if [ "$WAIT" -lt 0 ]; then
            echo "::warning::board has no pending fixture — handing over anyway so the chain survives"
          else
            echo "handing over (next kickoff in $((WAIT/60)) min)"
          fi
          gh workflow run live-sweep.yml --ref "${{ github.ref_name }}"

          # AND THE WATCHDOG DOES NOT DEPEND ON ITS OWN CRON EITHER.
          # health.py is standard library and answers in a moment, and
          # this chain hops continuously, so every hop can ask whether
          # the page the bettor sees still matches the board — the one
          # fault no job here can see from the inside. Only a sick answer
          # wakes the alarm job, and only if it has not run in the last
          # hour, so a deploy that stays broken cannot spin it.
          if python scripts/health.py --quiet; then
            echo "health: the reader sees the current board"
          else
            LAST=$(gh run list --workflow=health.yml --limit 1 \
                     --json createdAt --jq '.[0].createdAt' 2>/dev/null || true)
            AGE=99999
            [ -n "$LAST" ] && AGE=$(( $(date +%s) - $(date -d "$LAST" +%s) ))
            if [ "$AGE" -ge 3600 ]; then
              echo "::warning::health check failed — waking the health job"
              gh workflow run health.yml --ref "${{ github.ref_name }}" || true
            else
              echo "health check failed; the health job ran $((AGE/60)) min ago, leaving it"
            fi
          fi
